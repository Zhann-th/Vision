<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISION AI Studio — Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script type="module" src="script.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --outer-bg: #0F0F0E;
            --window-bg: #17171A;
            --panel-left-bg: #1C1C20;
            --panel-right-bg: #111113;
            --header-bg: #17171A;
            --border: #2A2A2E;
            --border-subtle: #222226;
            --fg: #E8E8E0;
            --fg-muted: #666660;
            --fg-dim: #444440;
            --accent: #8B7CF6;
            --accent-soft: rgba(139, 124, 246, 0.15);
            --accent-green: #5CC984;
            --accent-green-soft: rgba(92, 201, 132, 0.12);
            --radius: 24px;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Outfit', sans-serif;
            background: var(--outer-bg);
            color: var(--fg);
            overflow: hidden;
        }

        /* Outer shell with breathing room */
        .app-shell {
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 16px;
        }

        /* The floating window */
        .app-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--window-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 24px 80px rgba(0,0,0,0.6),
                0 4px 16px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* Header */
        .app-header {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            background: var(--header-bg);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .app-logo {
            font-size: 17px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 100px;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .back-link {
            font-size: 12px;
            color: var(--fg-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.15s;
        }

        .back-link:hover { color: var(--fg); }

        .mode-tabs {
            display: flex;
            gap: 2px;
            background: rgba(255,255,255,0.04);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .mode-tab {
            padding: 6px 14px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--fg-muted);
            background: transparent;
            transition: all 0.18s ease;
            font-family: 'Outfit', sans-serif;
        }

        .mode-tab.active {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid rgba(139,124,246,0.2);
        }

        .mode-tab .material-symbols-rounded { font-size: 15px; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .sign-in-btn {
            padding: 7px 16px;
            background: rgba(255,255,255,0.06);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sign-in-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }

        /* Profile dropdown */
        .profile-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1E1E22;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
            width: 220px;
            padding: 14px;
            display: none;
            z-index: 100;
        }

        .profile-dropdown.visible { display: block; }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .profile-info .material-symbols-rounded { font-size: 32px; color: var(--fg-muted); }

        .profile-name { font-weight: 700; font-size: 13px; display: block; color: var(--fg); }
        .profile-email { font-size: 11px; color: var(--fg-muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .logout-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            color: #F87171;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .logout-btn:hover { background: rgba(248,113,113,0.08); }

        /* Workspace layout */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Panel */
        .panel-left {
            width: 40%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--panel-left-bg);
            flex-shrink: 0;
        }

        .panel-label {
            padding: 14px 20px 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--fg-dim);
        }

        /* Upload zone */
        .upload-zone {
            flex: 1;
            margin: 0 16px 12px;
            position: relative;
            border-radius: 16px;
            border: 1.5px dashed var(--border);
            background: rgba(255,255,255,0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: border-color 0.2s, background 0.2s;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            transition: transform 0.3s;
            text-align: center;
            padding: 24px;
        }

        .upload-zone:hover .upload-placeholder { transform: translateY(-6px); }

        .upload-icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 100px;
            background: rgba(139,124,246,0.1);
            border: 1px solid rgba(139,124,246,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 28px;
            color: var(--accent);
        }

        .upload-placeholder h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--fg); }
        .upload-placeholder p  { font-size: 12px; color: var(--fg-muted); }

        /* Preview container */
        .preview-container {
            position: absolute;
            inset: 0;
            background: var(--panel-left-bg);
            display: none;
        }

        .preview-container.visible { display: block; }

        .image-gallery {
            width: 100%;
            height: 100%;
            padding: 12px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            align-content: start;
        }

        .preview-actions {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
        }

        .preview-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .preview-action-btn:hover { transform: scale(1.1); opacity: 0.9; }
        .preview-action-btn.add   { background: var(--accent); color: #fff; }
        .preview-action-btn.clear { background: #ef4444; color: #fff; }

        /* Instructions Panel */
        .instructions-panel {
            height: 156px;
            border-top: 1px solid var(--border);
            background: #141416;
            display: flex;
            flex-direction: column;
            padding: 14px 20px;
            flex-shrink: 0;
        }

        .instructions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .instructions-header .panel-label { padding: 0; }

        .mode-select {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--fg-muted);
        }

        .mode-select select {
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 8px;
            background: rgba(255,255,255,0.04);
            color: var(--fg);
            cursor: pointer;
            outline: none;
        }

        .mode-select select:focus { border-color: var(--accent); }

        textarea#rawTextInput {
            flex: 1;
            width: 100%;
            background: transparent;
            resize: none;
            border: none;
            outline: none;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            color: var(--fg);
            line-height: 1.65;
        }

        textarea#rawTextInput::placeholder { color: var(--fg-dim); }

        /* Right Panel */
        .panel-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-right-bg);
            overflow: hidden;
        }

        /* Output Toolbar */
        .output-toolbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            background: var(--window-bg);
            flex-shrink: 0;
        }

        .output-tabs {
            display: flex;
            gap: 2px;
        }

        .output-tab {
            padding: 6px 16px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.18s;
            font-family: 'Outfit', sans-serif;
        }

        .output-tab.active { background: var(--accent-soft); color: var(--accent); }
        .output-tab:not(.active) { background: transparent; color: var(--fg-muted); }
        .output-tab:not(.active):hover { background: rgba(255,255,255,0.04); color: var(--fg); }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 7px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg-muted);
            transition: background 0.15s, color 0.15s;
            font-size: 17px;
        }

        .icon-action-btn:hover { background: rgba(255,255,255,0.06); color: var(--fg); }

        .download-btn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--accent-green-soft);
            color: var(--accent-green);
            border: 1px solid rgba(92,201,132,0.2);
            border-radius: 7px;
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .download-btn:hover { opacity: 0.8; }

        .generate-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 9px;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(139,124,246,0.3);
        }

        .generate-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(139,124,246,0.4);
        }

        .generate-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
        .generate-btn .material-symbols-rounded { font-size: 17px; }

        /* Output area */
        .output-area {
            flex: 1;
            position: relative;
            background: var(--panel-right-bg);
            overflow: hidden;
        }

        /* Empty state */
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--fg-dim);
            gap: 12px;
        }

        .empty-state .empty-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state .material-symbols-rounded { font-size: 32px; }
        .empty-state p { font-size: 13px; font-weight: 500; color: var(--fg-muted); }

        /* Loading state */
        .loading-state {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel-right-bg);
            z-index: 5;
            gap: 20px;
        }

        .loading-state.visible { display: flex; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 100px;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-state h4 { font-size: 15px; font-weight: 700; color: var(--fg); }

        .progress-track {
            width: 200px;
            height: 2px;
            background: var(--border);
            border-radius: 100px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-green));
            border-radius: 100px;
            transition: width 0.3s ease;
        }

        /* Final state */
        .final-state {
            display: none;
            position: absolute;
            inset: 0;
            flex-direction: column;
        }

        .final-state.visible { display: flex; }

        .preview-pane {
            flex: 1;
            background: #fff;
            overflow: hidden;
        }

        .preview-pane iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .code-pane {
            display: none;
            flex: 1;
            background: #0D0D0F;
            overflow: hidden;
        }

        .code-pane.visible { display: flex; }

        .code-pane textarea {
            flex: 1;
            width: 100%;
            height: 100%;
            background: transparent;
            color: #BABAB0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            line-height: 1.75;
            padding: 24px;
            resize: none;
            border: none;
            outline: none;
        }

        /* Auth Modal */
        .auth-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .auth-modal.visible { display: flex; }

        .auth-box {
            background: #1C1C20;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px;
            width: 360px;
            position: relative;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
        }

        .auth-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 30px;
            height: 30px;
            border: none;
            background: rgba(255,255,255,0.06);
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg-muted);
            transition: background 0.15s;
        }

        .auth-close:hover { background: rgba(255,255,255,0.1); color: var(--fg); }

        .auth-box h2 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 24px;
            color: var(--fg);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .auth-input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            background: rgba(255,255,255,0.04);
            color: var(--fg);
        }

        .auth-input::placeholder { color: var(--fg-dim); }
        .auth-input:focus { border-color: var(--accent); }

        .auth-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 9px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 16px rgba(139,124,246,0.3);
        }

        .auth-submit:hover { opacity: 0.9; }

        .auth-switch {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            color: var(--fg-muted);
        }

        .auth-switch button {
            font-weight: 700;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
        }

        .auth-switch button:hover { text-decoration: underline; }

        .auth-error {
            display: none;
            color: #F87171;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }

        /* ── JS-driven state classes (used by script.js) ── */
        .hidden { display: none !important; }

        /* When upload area has images — disable click-to-open behavior visually */
        .upload-zone.has-image { cursor: default; }
        .upload-zone.has-image:hover { border-color: var(--border); background: rgba(255,255,255,0.02); }
        .upload-zone.has-image .upload-placeholder { transform: none !important; }

        /* Preview container: script uses .hidden class to toggle */
        #previewContainer.hidden { display: none !important; }
        #previewContainer:not(.hidden) { display: block !important; }

        /* uploadContent: script toggles .hidden */
        #uploadContent.hidden { display: none !important; }

        /* loadingState: script removes/adds .hidden */
        #loadingState.hidden { display: none !important; }
        #loadingState:not(.hidden) { display: flex !important; }

        /* finalState: script removes/adds .hidden */
        #finalState.hidden { display: none !important; }
        #finalState:not(.hidden) { display: flex !important; }

        /* resultBox: script removes .hidden */
        #resultBox.hidden { display: none !important; }

        /* profile dropdown: script uses .hidden */
        #profileDropdown.hidden { display: none !important; }

        /* gallery images */
        .gallery-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .doc-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            color: var(--fg-muted);
            aspect-ratio: 4/3;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        /* drag-over visual */
        .upload-zone.dragover {
            border-color: var(--accent) !important;
            background: var(--accent-soft) !important;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="app-window">

            <!-- Header -->
            <header class="app-header">
                <div class="header-left">
                    <div class="app-logo">
                        <div class="logo-dot"></div>
                        VISION
                        <a href="index.html" class="back-link">
                            <span class="material-symbols-rounded" style="font-size:14px;">arrow_back</span>
                            Back
                        </a>
                    </div>
                    <div class="mode-tabs">
                        <button id="taskCodeBtn" class="mode-tab active">
                            <span class="material-symbols-rounded">draw</span> Sketch to Code
                        </button>
                        <button id="taskOcrBtn" class="mode-tab">
                            <span class="material-symbols-rounded">notes</span> OCR
                        </button>
                        <button id="taskExcelBtn" class="mode-tab">
                            <span class="material-symbols-rounded">table</span> Data
                        </button>
                    </div>
                </div>

                <div class="header-right">
                    <button id="navLoginBtn" class="sign-in-btn">Sign In</button>

                    <div id="profileDropdown" class="profile-dropdown">
                        <div class="profile-info">
                            <span class="material-symbols-rounded">account_circle</span>
                            <div>
                                <span id="profileName" class="profile-name">User</span>
                                <span id="profileEmail" class="profile-email">user@example.com</span>
                            </div>
                        </div>
                        <button id="profileLogoutBtn" class="logout-btn">
                            <span class="material-symbols-rounded" style="font-size:16px;">logout</span> Logout
                        </button>
                    </div>
                </div>
            </header>

            <!-- Workspace -->
            <main class="workspace">

                <!-- Left: Input Panel -->
                <section class="panel-left">
                    <div class="panel-label">Source Material</div>

                    <div id="uploadArea" class="upload-zone">
                        <input type="file" id="fileInput" accept="image/*,application/pdf,.doc,.docx" multiple hidden aria-hidden="true">

                        <div id="uploadContent" class="upload-placeholder">
                            <div class="upload-icon-circle">
                                <span class="material-symbols-rounded">add_photo_alternate</span>
                            </div>
                            <h3>Drop sketch or file</h3>
                            <p>Images, PDFs, Word documents</p>
                        </div>

                        <div id="previewContainer" class="preview-container hidden">
                            <div id="imageGallery" class="image-gallery"></div>
                            <div class="preview-actions">
                                <button id="addMoreBtn" class="preview-action-btn add" title="Add More">
                                    <span class="material-symbols-rounded" style="font-size:18px;">add</span>
                                </button>
                                <button id="clearBtn" class="preview-action-btn clear" title="Clear All">
                                    <span class="material-symbols-rounded" style="font-size:18px;">delete</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="instructions-panel">
                        <div class="instructions-header">
                            <div class="panel-label">Instructions</div>
                            <div class="mode-select" id="generationSettings">
                                <span class="material-symbols-rounded" style="font-size:14px;">tune</span>
                                <select id="generationMode">
                                    <option value="simple">Strict Mode</option>
                                    <option value="creative">Creative AI</option>
                                </select>
                            </div>
                        </div>
                        <textarea id="rawTextInput" placeholder="'Use Tailwind', 'keep the table structure', 'output JSON'..."></textarea>
                    </div>
                </section>

                <!-- Right: Output Panel -->
                <section class="panel-right">
                    <div class="output-toolbar">
                        <div class="output-tabs">
                            <button id="tabPreview" class="output-tab active">Preview</button>
                            <button id="tabCode" class="output-tab">Code</button>
                        </div>

                        <div class="toolbar-actions">
                            <button id="downloadExcelBtn" class="download-btn">
                                <span class="material-symbols-rounded" style="font-size:15px;">download</span> Excel
                            </button>
                            <button id="openNewTabBtn" class="icon-action-btn" title="Open Fullscreen">
                                <span class="material-symbols-rounded">open_in_new</span>
                            </button>
                            <button id="copyBtn" class="icon-action-btn" title="Copy Code">
                                <span class="material-symbols-rounded">content_copy</span>
                            </button>
                            <button id="extractBtn" class="generate-btn" disabled>
                                <span class="material-symbols-rounded" id="btnIcon">magic_button</span>
                                <span id="btnText">Generate</span>
                            </button>
                        </div>
                    </div>

                    <div id="resultBox" class="output-area">
                        <div id="emptyState" class="empty-state">
                            <div class="empty-icon">
                                <span class="material-symbols-rounded">code_blocks</span>
                            </div>
                            <p>Upload a sketch and hit Generate</p>
                        </div>

                        <div id="loadingState" class="loading-state hidden">
                            <div class="spinner"></div>
                            <h4 id="loadingStatus">Analyzing Sketch...</h4>
                            <div class="progress-track">
                                <div id="processingProgress" class="progress-fill" style="width:0%"></div>
                            </div>
                        </div>

                        <div id="finalState" class="final-state hidden">
                            <div id="previewPane" class="preview-pane">
                                <iframe id="livePreviewFrame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                            </div>
                            <div id="codePane" class="code-pane">
                                <textarea id="extractedText" readonly></textarea>
                            </div>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="auth-modal hidden">
        <div class="auth-box">
            <button id="closeAuthModal" class="auth-close">
                <span class="material-symbols-rounded" style="font-size:16px;">close</span>
            </button>
            <h2 id="authModalTitle">Sign In</h2>
            <form id="authForm" class="auth-form">
                <input type="email" id="authEmail" class="auth-input" placeholder="Email" required>
                <input type="password" id="authPassword" class="auth-input" placeholder="Password" required>
                <button type="submit" id="authSubmitBtn" class="auth-submit">Sign In</button>
            </form>
            <p class="auth-switch">
                <span id="authToggleText">Don't have an account?</span>
                <button id="authToggleBtn">Sign Up</button>
            </p>
            <p id="authErrorMsg" class="auth-error"></p>
        </div>
    </div>

</body>
</html>
